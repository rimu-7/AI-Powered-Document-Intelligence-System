name: frontend-ci
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Check OpenAPI types regeneration
        run: |
          pnpm exec openapi-typescript openapi.json -o lib/api/schema.d.ts
          git diff --exit-code lib/api/schema.d.ts || (echo "schema.d.ts is out of date. Run openapi-typescript and commit changes." && exit 1)

      - name: Unit and Component Tests
        run: pnpm run test

      - name: Build Next.js application
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          API_INTERNAL_URL: http://api:8000

