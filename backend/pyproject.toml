[project]
name = "docintel-ai"
version = "0.1.0"
description = "DocIntel AI - document intelligence and financial verification platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.120",
    "celery[redis]>=5.6.3",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pymupdf>=1.28.2,<2",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "boto3-stubs>=1.43.120",
    "hypothesis>=6.170.13",
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "testcontainers>=4.15.0",
    "xlwt>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = false

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF", "ASYNC", "DTZ"]
ignore = [
  "S101",   # assert used for invariants/type narrowing
  "S311",   # random used for jitter, not crypto
  "B008",   # FastAPI Depends in defaults
  "RUF012",
  "SIM108",
  "E501",   # long lines handled by formatter where practical
  "S608",   # SQL built only from fixed fragments + bound params (reviewed)
  "RUF001", "RUF002", "RUF003",  # intentional unicode (currency symbols, ×, −)
  "S105", "S106",
  "S110", "S112", "SIM105", "SIM102", "RUF007",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE", "DTZ", "B017", "ASYNC"]
"evaluation/**" = ["S", "DTZ"]
"scripts/**" = ["S", "DTZ", "BLE"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false
warn_unused_ignores = false
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/versions", "tests", "evaluation", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: needs PostgreSQL/Redis/MinIO (testcontainers or TEST_* env vars)",
  "ocr: needs the tesseract binary",
  "slow: long-running performance tests",
]
filterwarnings = ["ignore::DeprecationWarning:pymupdf.*", "ignore::DeprecationWarning:swig.*"]

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]
omit = ["app/workers/metrics_server.py"]
