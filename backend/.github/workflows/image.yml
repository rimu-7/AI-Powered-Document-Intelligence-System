name: image
on:
  push: { branches: [main], tags: ["v*"] }
permissions: { contents: read, packages: write, security-events: write }

jobs:
  build-scan-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with: { images: "ghcr.io/${{ github.repository }}", tags: "type=sha\ntype=ref,event=tag" }
      - name: Build (local, for scanning)
        uses: docker/build-push-action@v6
        with: { context: ., target: runtime, load: true, tags: "docintel-ai:scan", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Container scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.33.1
        with: { image-ref: "docintel-ai:scan", severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1", format: sarif, output: trivy.sarif }
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy.sarif }
      - name: Push
        uses: docker/build-push-action@v6
        with: { context: ., target: runtime, push: true, tags: "${{ steps.meta.outputs.tags }}", labels: "${{ steps.meta.outputs.labels }}", cache-from: type=gha, provenance: true, sbom: true }
